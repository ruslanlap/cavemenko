description = "Show cavemenko measured stats (real token counts, not estimates)"
prompt = "Read the file $CLAUDE_CONFIG_DIR/.cavemenko-stats (fall back to ~/.claude/.cavemenko-stats) and report ONLY what is literally in it. Do NOT estimate, extrapolate, or invent any number — if a field is missing, say 'not measured yet'. Report: turns, tokens used, baseline tokens, saved tokens, and the compression % ONLY if savedTokens > 0. If savedTokens is 0, explain in one line: savings are only computable after at least one turn ran with cavemenko OFF (the Stop hook records those as the baseline). Keep it to a short table."
